# MercadoNow — local dev infrastructure.
# Start:  docker compose up -d postgres
# Stop:   docker compose down
# Wipe:   docker compose down -v   (deletes the pg data volume)

services:
  postgres:
    image: postgres:16-alpine
    container_name: mercadonow-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: mercadonow
      POSTGRES_PASSWORD: mercadonow
      POSTGRES_DB: mercadonow
    ports:
      - "5432:5432"
    volumes:
      - mercadonow_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mercadonow -d mercadonow"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  mercadonow_pgdata: