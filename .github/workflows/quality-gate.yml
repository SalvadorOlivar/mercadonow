name: Quality Gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mercadonow
          POSTGRES_PASSWORD: mercadonow
          POSTGRES_DB: mercadonow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mercadonow -d mercadonow"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgres://mercadonow:mercadonow@localhost:5432/mercadonow_test
      NODE_ENV: test
      PORT: 3001
      CORS_ORIGINS: http://localhost:3000
      OPENAPI_ENABLED: "false"
      NEXT_PUBLIC_API_URL: http://localhost:3001

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run quality gate
        run: pnpm verify
